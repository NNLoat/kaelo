      <script>
        const tl = gsap.timeline({ paused: true });
        // No fade to/from paper at seams — content is present instantly and
        // hard-cuts to the next scene on the shared paper bg (no dead air).
        tl.set("#s02-fade", { opacity: 1 }, 0);

        function countUp(id, to, decimals, at) {
          const el = document.getElementById(id);
          const o = { v: 0 };
          tl.to(o, {
            v: to, duration: 0.8, ease: "power2.out",
            onUpdate: () => { el.textContent = decimals ? o.v.toFixed(decimals) : Math.round(o.v).toString(); }
          }, at);
        }

        // Card windows: 0-8, 8-16, 16-25, 25-35 (scene-local). Cross-fade 0.35s + 16px slide.
        const cards = [
          { c: "#s02-c1", n: () => countUp("s02-n1", 70, 0, 0.6), in: 0, out: 7.6 },
          { c: "#s02-c2", n: () => countUp("s02-n2", 28, 0, 8.4), in: 8.0, out: 15.6 },
          { c: "#s02-c3", n: () => countUp("s02-n3", 4, 0, 16.4), in: 16.0, out: 24.6 },
          { c: "#s02-c4", n: () => countUp("s02-n4", 53.5, 1, 25.4), in: 25.0, out: 35.0 },
        ];
        cards.forEach((card, i) => {
          // First card is present at t=0 (hard-cut from S01, no blank seam frame);
          // later cards cross-fade in as before.
          const fromOpacity = i === 0 ? 1 : 0;
          tl.fromTo(card.c, { opacity: fromOpacity, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, card.in);
          card.n();
          tl.to(card.c, { opacity: 0, y: -16, duration: 0.35, ease: "power2.inOut" }, card.out);
        });

        window.__timelines["s02"] = tl;
        tl.seek(0);
      </script>
