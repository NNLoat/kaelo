        #s03-head {
          font-family: Georgia, "Times New Roman", serif;

        .s03-chip {
          background: #ffffff; border: 1px solid #e2e8f0; border-radius: 999px;
          padding: 18px 34px; font-size: 30px; color: #0f172a; opacity: 0;

      <div data-hf-id="hf-ajrt" id="root" data-composition-id="s03" data-width="1920" data-height="1080" data-duration="15.4">
        <div data-hf-id="hf-e88y" id="s03-fade">
          <div data-hf-id="hf-yogc" id="s03-wrap">
            <div data-hf-id="hf-m8tv" id="s03-left">
              <div data-hf-id="hf-7gk8" id="s03-num">4,909</div>
              <div data-hf-id="hf-a9pf" class="label">Mahidol publications indexed in Scopus, 2025.</div>
              <div data-hf-id="hf-k17i" class="src">[13]</div>
            </div>

              <div data-hf-id="hf-zuqi" id="s03-head">World-class research means research others can <b data-hf-id="hf-8maq">verify and build on</b>.</div>

          </div>

      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // No fade to/from paper at seams — content present instantly, hard-cut.
        tl.set("#s03-fade", { opacity: 1 }, 0);

        // 0-7s: numeral + label count up. Opening content is present at t=0 so
        // the S02->S03 cut lands on content (no blank seam frame); the x-slide is
        // pure motion from an already-visible state.
        tl.fromTo("#s03-left", { opacity: 1, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0);
        const o = { v: 0 };
        const numEl = document.getElementById("s03-num");
        tl.to(o, { v: 4909, duration: 1.0, ease: "power2.out",
          onUpdate: () => { numEl.textContent = Math.round(o.v).toLocaleString("en-US"); } }, 0.2);

        // 7-15s: headline + chips + line + caption
        tl.fromTo("#s03-head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 7.0);
        tl.fromTo("#s03-chipA", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.0);
        tl.to("#s03-join", { width: 60, duration: 0.5, ease: "power3.inOut" }, 8.4);
        tl.fromTo("#s03-chipB", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.7);
        tl.fromTo("#s03-cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 9.6);

        window.__timelines["s03"] = tl;
        tl.seek(0);
      </script>
